openapi: 3.0.3
info:
  title: volei.space - API do Meu Time (Rodada 3)
  version: 0.3.0
  description: |
    Contrato das rotas /api/meu-time. STATUS: implementado no código, mas depende das migrations PENDENTES
    202610170024 a 202610170026 (supabase/pendentes) e do ajuste do CHECK de status da inscrição pelo agente de banco.
    Rodada 3 (agente de banco, em paralelo): tabela "ComissaoTime"(id, timeId, nome, funcao, criadoEm), colunas
    Atleta.posicao e Atleta.numeroPreferido e Atleta.origem='LOTE' (nascimento nulo só nessa origem).
    Sem elas a API tolera: ComissaoTime ausente = 503 (o detalhe da equipe devolve `comissao: []`); colunas ausentes =
    grava sem elas; CHECK antigo sem 'LOTE' = regrava com origem MIGRACAO.

    Regras gerais
    - Atrás de MEU_TIME_ATIVO=1. Desligado: 404 `{error:'Não encontrado.'}` em todas as rotas.
    - Tabela das migrations inexistente: 503 `{error:'Meu Time ainda não está habilitado neste ambiente.'}`.
    - Sessão pública existente (cookie ou Bearer), conta do tipo `equipe`. Sem sessão: 401 `{error:'Não autorizado'}`.
    - Sucesso `{data}`; falha `{error, codigo?, erros?}`. A inscrição devolve também `avisos` ao lado de `data`.
    - Posse por MembroEquipe. Quem não é membro recebe 404 (a equipe "não existe" para ele).
      Leitura: RESPONSAVEL, TECNICO, ASSISTENTE, CAPITAO. Escrita (atletas, inscrição): RESPONSAVEL e TECNICO.
      Membros com acesso (adicionar/remover) e dados do time (PATCH): só RESPONSAVEL.
      Comissão técnica (adicionar/remover): RESPONSAVEL e TECNICO. Sem permissão: 403 `SEM_PERMISSAO`.
    - NUNCA devolve CPF, documento, telefone, e-mail, hash ou caminho de arquivo. Só `temDocumento`.
    - Inscrição automática: sem aprovação. Status: RASCUNHO, CONFIRMADA, CONFIRMADA_COM_PENDENCIAS,
      AJUSTE_PEDIDO, REMOVIDA. O organizador nunca vê o banco de atletas do time; a inscrição guarda uma CÓPIA.
    - O banco de atletas pertence ao CLUBE (VinculoAtletaClube): equipes do mesmo clube enxergam os mesmos atletas.

    LGPD de menores (Rodada 8, versão 0.3.0). STATUS: implementado no código; depende da migration PENDENTE
    202610170032 e da variável LGPD_CHAVE_CIFRA (32 bytes em base64, fora do banco). Texto do termo, base legal e
    retenção são DECISÕES JURÍDICAS PENDENTES (docs/analise/25-lgpd-menores.md); o termo atual é rascunho.
    - `Atleta` traz `menor` (calculado no servidor pela data de nascimento) e `consentimentoPendente`
      (menor sem autorização ativa do responsável). NUNCA traz nome ou contato do responsável.
    - Para atleta menor, POST/PATCH de atleta aceitam `responsavel: {nome, contato}` + `aceiteResponsavel: true`
      (os dois juntos). O servidor grava nome, contato CIFRADO, data/hora, `versaoTermo` (src/lib/lgpd/termo.ts) e quem
      registrou. Sem isso o menor entra com `consentimentoPendente = true`. Para maior de idade o envio é recusado
      (422 RESPONSAVEL_DESNECESSARIO: não se coleta dado de responsável de adulto). Sem a chave de cifra: 503.
    - A inscrição NÃO bloqueia por falta de autorização: devolve `avisos` com o código ATLETA_MENOR_SEM_CONSENTIMENTO
      e status CONFIRMADA_COM_PENDENCIAS.
    - Sem a migration 0032: todo menor aparece pendente, gravar autorização dá 503 e o DELETE de atleta só desativa o vínculo.
servers:
  - url: /api
paths:
  /meu-time:
    get:
      summary: Equipes do usuário logado
      responses:
        '200':
          description: Lista de equipes com prontidão
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [equipes]
                    properties:
                      equipes:
                        type: array
                        items: { $ref: '#/components/schemas/EquipeResumo' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes:
    post:
      summary: Cria uma equipe (quem cria vira RESPONSAVEL)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, naipe]
              properties:
                nome: { type: string, minLength: 1, maxLength: 200 }
                cidade: { type: string, maxLength: 120, nullable: true }
                naipe: { $ref: '#/components/schemas/Naipe' }
                escudoUrl: { type: string, format: uri, maxLength: 500, nullable: true }
      responses:
        '201':
          description: Equipe criada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EquipeResumo' }
        '409':
          # Já existe equipe com esse nome e naipe (codigo EQUIPE_DUPLICADA)
          $ref: '#/components/responses/Erro'
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    get:
      summary: Detalhe da equipe
      responses:
        '200':
          description: Equipe, atletas, comissão, inscrições e prontidão
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [equipe, atletas, comissao, membros, inscricoes, prontidao]
                    properties:
                      equipe: { $ref: '#/components/schemas/Equipe' }
                      meuPapel:
                        type: string
                        enum: [RESPONSAVEL, TECNICO, ASSISTENTE, CAPITAO]
                        description: Papel de quem está logado nesta equipe (a tela decide quais botões de gestão mostrar).
                      atletas:
                        type: array
                        items: { $ref: '#/components/schemas/Atleta' }
                      comissao:
                        type: array
                        description: Comissão técnica (nome e função). Vazia se a tabela ainda não existe.
                        items: { $ref: '#/components/schemas/MembroComissao' }
                      membros:
                        type: array
                        description: Contas com acesso à equipe
                        items: { $ref: '#/components/schemas/Membro' }
                      inscricoes:
                        type: array
                        items: { $ref: '#/components/schemas/InscricaoResumo' }
                      prontidao: { $ref: '#/components/schemas/Prontidao' }
        '404': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
    patch:
      summary: Edita os dados do time (aba "Dados do time"). Só RESPONSAVEL; o naipe não muda.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string, minLength: 1, maxLength: 200 }
                cidade: { type: string, maxLength: 120, nullable: true }
                escudoUrl: { type: string, format: uri, maxLength: 500, nullable: true }
      responses:
        '200':
          description: Equipe atualizada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Equipe' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409':
          # Já existe equipe com esse nome e naipe (EQUIPE_DUPLICADA)
          $ref: '#/components/responses/Erro'
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/prontidao:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    get:
      summary: Cartão de prontidão ("Seu time tem 9 atletas. 2 estão sem documento.")
      responses:
        '200':
          description: Prontidão
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Prontidao' }
        '404': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/atletas:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    post:
      summary: Cadastra um atleta no banco do time
      description: |
        `numeroPreferido` e `posicao` são gravados e devolvidos. Se as colunas ainda não existem em "Atleta",
        o cadastro é regravado sem elas e voltam null.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, dataNascimento]
              properties:
                nome: { type: string, minLength: 1, maxLength: 200 }
                dataNascimento: { type: string, format: date, description: 'AAAA-MM-DD, de 1920-01-01 até hoje' }
                numeroPreferido: { type: integer, minimum: 0, maximum: 99, nullable: true }
                posicao: { type: string, enum: [LV, PT, OP, CT, LB], nullable: true }
                responsavel: { $ref: '#/components/schemas/ResponsavelEntrada' }
                aceiteResponsavel: { type: boolean, enum: [true], description: 'Só `true`. Vai junto com `responsavel`; só para menor de 18 anos.' }
      responses:
        '201':
          description: Atleta criado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Atleta' }
        '409':
          # Mesmo nome e nascimento já no banco do time (ATLETA_DUPLICADO)
          $ref: '#/components/responses/Erro'
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/atletas/lote:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    post:
      summary: Cadastra atletas em lote ("colar lista")
      description: |
        Aceita `atletas` (contrato) ou `texto` (lista colada do WhatsApp, mesmo parser da inscrição rápida).
        Até 100 linhas. Repetidos (mesmo nome), linhas sem nome e camisa fora de 0..99 vão em `ignorados`.
        Linhas sem `dataNascimento` entram com origem 'LOTE' (o banco só aceita nascimento vazio nessa origem)
        e ficam com a pendência "falta nascimento" quando a categoria tem faixa de idade.
        `numero` vira `numeroPreferido` e `posicao` é gravada (a camisa definitiva é escolhida na inscrição).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                atletas:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [nome]
                    properties:
                      nome: { type: string }
                      numero: { type: integer, minimum: 0, maximum: 99, nullable: true }
                      dataNascimento: { type: string, format: date, nullable: true }
                      posicao: { type: string, enum: [LV, PT, OP, CT, LB], nullable: true }
                texto: { type: string, maxLength: 20000 }
      responses:
        '200':
          description: Resultado do lote
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [criados, ignorados]
                    properties:
                      criados:
                        type: array
                        items: { $ref: '#/components/schemas/Atleta' }
                      ignorados:
                        type: array
                        items:
                          type: object
                          required: [linha, motivo]
                          properties:
                            linha: { type: integer, description: 'Posição (1 a N) na lista enviada' }
                            motivo: { type: string }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/atletas/{atletaId}:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
      - name: atletaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Edita um atleta do banco do time
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                nome: { type: string, minLength: 1, maxLength: 200 }
                dataNascimento: { type: string, format: date }
                numeroPreferido: { type: integer, minimum: 0, maximum: 99, nullable: true }
                posicao: { type: string, enum: [LV, PT, OP, CT, LB], nullable: true }
                responsavel: { $ref: '#/components/schemas/ResponsavelEntrada' }
                aceiteResponsavel: { type: boolean, enum: [true], description: 'Só `true`. Vai junto com `responsavel`; só se o atleta (após a edição) for menor de 18 anos; renova a autorização.' }
      responses:
        '200':
          description: Atleta atualizado
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/Atleta' }
        '409': { $ref: '#/components/responses/Erro' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
    delete:
      summary: Pedido de exclusão do atleta (anonimiza a PII e tira do banco do time)
      description: |
        Registra o pedido (quem, quando, motivo) e ANONIMIZA cpf (hash), documento, foto, arquivos, telefones e o
        nome/contato do responsável. O histórico de jogos fica: `Atleta.id`, nome e as cópias em inscrições/súmula
        permanecem (o nome ficar é decisão jurídica pendente). Se o atleta ainda está ativo em OUTRO clube, só o
        vínculo deste clube sai (`anonimizado: false`, escopo VINCULO). Sem a migration 0032, só desativa o vínculo.
        Corpo opcional. Perfis: RESPONSAVEL e TECNICO.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                motivo: { type: string, minLength: 1, maxLength: 500, nullable: true }
      responses:
        '200':
          description: Removido
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [removido, anonimizado]
                    properties:
                      removido: { type: boolean }
                      anonimizado: { type: boolean }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/atletas/{atletaId}/consentimento:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
      - name: atletaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      summary: Completa (ou renova) a autorização do responsável de um atleta menor
      description: |
        Só RESPONSAVEL e TECNICO. O aceite anterior ativo é revogado e substituído. 422 ATLETA_MAIOR_DE_IDADE se o
        atleta não é menor. O contato é cifrado e nunca devolvido. 503 sem LGPD_CHAVE_CIFRA ou sem a migration 0032.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [responsavel, aceiteResponsavel]
              properties:
                responsavel: { $ref: '#/components/schemas/ResponsavelEntrada' }
                aceiteResponsavel: { type: boolean, enum: [true] }
      responses:
        '201':
          description: Autorização registrada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EstadoConsentimento' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
    delete:
      summary: Revoga a autorização ativa (o atleta volta a pendente). Idempotente.
      responses:
        '200':
          description: Estado depois da revogação
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/EstadoConsentimento' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/consentimentos:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    get:
      summary: Atletas menores do banco do time e o estado da autorização do responsável
      description: Só RESPONSAVEL e TECNICO (ASSISTENTE e CAPITAO recebem 403). Nunca devolve contato do responsável.
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [termo, totalMenores, pendentes, atletas]
                    properties:
                      termo:
                        type: object
                        properties:
                          versao: { type: string, example: '2026-10-rascunho-1' }
                          texto: { type: string, description: 'Rascunho técnico, sem validação jurídica.' }
                      totalMenores: { type: integer }
                      pendentes: { type: integer }
                      atletas:
                        type: array
                        items:
                          allOf:
                            - { $ref: '#/components/schemas/EstadoConsentimento' }
                            - type: object
                              properties:
                                nome: { type: string }
                                dataNascimento: { type: string, format: date }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/comissao:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    get:
      summary: Comissão técnica do time (tabela "ComissaoTime")
      responses:
        '200':
          description: Comissão técnica
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MembroComissao' }
        '404': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
    post:
      summary: Cadastra pessoa na comissão técnica (RESPONSAVEL ou TECNICO; a pessoa não precisa de conta)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nome, funcao]
              properties:
                nome: { type: string, minLength: 1, maxLength: 200 }
                funcao: { $ref: '#/components/schemas/FuncaoComissao' }
      responses:
        '201':
          description: Pessoa adicionada
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/MembroComissao' }
        '409':
          # Mesmo nome e função já na comissão (COMISSAO_DUPLICADA)
          $ref: '#/components/responses/Erro'
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/comissao/{membroId}:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
      - name: membroId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      summary: Tira a pessoa da comissão técnica (RESPONSAVEL ou TECNICO). Cópias em inscrições permanecem.
      responses:
        '200':
          description: Removido
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      removido: { type: boolean }
        '403': { $ref: '#/components/responses/Erro' }
        '404':
          # Equipe ou membro (de outra equipe também) não encontrado (MEMBRO_NAO_ENCONTRADO)
          $ref: '#/components/responses/Erro'
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/membros:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    get:
      summary: Contas com acesso à equipe (id, nome, papel)
      responses:
        '200':
          description: Membros
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Membro' }
        '404': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
    post:
      summary: Pede acesso para uma conta (só RESPONSAVEL). Resposta uniforme, não revela se o e-mail tem conta.
      description: |
        M10. Responde sempre 202 com a mesma mensagem, haja conta com esse e-mail, não haja, ou a pessoa já seja
        membro. Não devolve id nem nome da conta. Se a conta existe e ainda não é membro, o acesso é concedido
        (sem aceite); quem entrou aparece em GET /membros. Limite de taxa: 10 pedidos por hora por usuário e 30
        por hora por IP (429 LIMITE_DE_TAXA com `retryAfterSeconds`), em memória por instância. Pendente de
        produto: aceite da pessoa convidada, que fecharia a enumeração pela lista.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, papel]
              properties:
                email: { type: string, format: email }
                papel: { type: string, enum: [TECNICO, ASSISTENTE] }
      responses:
        '202':
          description: Pedido recebido (mesma resposta com ou sem conta)
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [solicitado, mensagem]
                    properties:
                      solicitado: { type: boolean }
                      mensagem: { type: string }
        '404':
          # Equipe não encontrada
          $ref: '#/components/responses/Erro'
        '429':
          # LIMITE_DE_TAXA
          $ref: '#/components/responses/Erro'
        '403': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
    delete:
      summary: Remove o acesso (só RESPONSAVEL; o responsável não sai por aqui)
      parameters:
        - name: membroId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Removido
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    properties:
                      removido: { type: boolean }
        '400': { $ref: '#/components/responses/Erro' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409':
          # Tentou remover o responsável (RESPONSAVEL_FIXO)
          $ref: '#/components/responses/Erro'
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/equipes/{id}/inscricoes:
    parameters:
      - { $ref: '#/components/parameters/EquipeId' }
    post:
      summary: Inscreve a equipe em uma categoria (automática, sem aprovação)
      description: |
        Validado no servidor: campeonato aberto, naipe da equipe x gênero da categoria, atletas do banco do time,
        número único (0..99), no máximo 1 capitão, líberos até `liberosMax`, mínimo e máximo de atletas,
        faixa de nascimento/idade, atleta em um só time por categoria, comissão do próprio time e dentro do limite.
        Grava uma CÓPIA dos atletas. Status final: CONFIRMADA, ou CONFIRMADA_COM_PENDENCIAS se faltar documento
        (quando a RegraElenco exige) ou nascimento (quando há faixa de idade).
        `convite` (M7): obrigatório quando a categoria tem link de inscrição (`tokenInscricao`), quando o campeonato
        tem LinkInscricaoCampeonato ativo (não revogado nem expirado) ou quando a competição for privada (ainda não
        há coluna para isso no schema). Vale o token da categoria ou o do link do campeonato. Sem link e sem
        competição privada o campo é opcional e ignorado.
        Códigos de erro 422: SEM_ATLETAS, ATLETA_FORA_DO_TIME, ATLETA_REPETIDO, NUMERO_INVALIDO, NUMERO_REPETIDO,
        CAPITAO_LIBERO, MAIS_DE_UM_CAPITAO, LIBEROS_ACIMA, ABAIXO_DO_MINIMO, ACIMA_DO_MAXIMO, FORA_DA_IDADE,
        NAIPE_INCOMPATIVEL, ATLETA_EM_OUTRO_TIME, COMISSAO_ACIMA, MEMBRO_FORA_DA_EQUIPE.
        Outros: 403 INSCRICOES_FECHADAS / CONVITE_OBRIGATORIO / CONVITE_INVALIDO, 404 CATEGORIA_NAO_ENCONTRADA, 409 JA_INSCRITA /
        CONFLITO_DE_ELENCO. Em 422 o campo `erros` lista todas as violações ({codigo, mensagem, atletaId?}).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [categoriaCampeonatoId, atletas]
              properties:
                categoriaCampeonatoId: { type: string, format: uuid }
                atletas:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required: [atletaId, numero]
                    properties:
                      atletaId: { type: string, format: uuid }
                      numero: { type: integer, minimum: 0, maximum: 99 }
                      capitao: { type: boolean }
                      libero: { type: boolean }
                comissao:
                  type: array
                  maxItems: 20
                  description: ids de MembroComissao ("ComissaoTime") da própria equipe; copiados para InscricaoComissao (nome e função)
                  items: { type: string }
                convite: { type: string }
      responses:
        '201':
          description: Inscrição confirmada
          content:
            application/json:
              schema:
                type: object
                required: [data, avisos]
                properties:
                  data: { $ref: '#/components/schemas/InscricaoResumo' }
                  avisos:
                    type: array
                    description: |
                      Pendências (documento, nascimento) e lembretes (sem capitão, sem líbero). Menor sem autorização do
                      responsável gera um texto que COMEÇA por `ATLETA_MENOR_SEM_CONSENTIMENTO: ` e marca a inscrição
                      como CONFIRMADA_COM_PENDENCIAS (não bloqueia).
                    items: { type: string }
                  avisosDetalhe:
                    type: array
                    description: Pendências com código e atleta, para a tela destacar o atleta (hoje só ATLETA_MENOR_SEM_CONSENTIMENTO).
                    items:
                      type: object
                      properties:
                        codigo: { type: string, example: ATLETA_MENOR_SEM_CONSENTIMENTO }
                        mensagem: { type: string }
                        atletaId: { type: string, format: uuid }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409': { $ref: '#/components/responses/Erro' }
        '422': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
  /meu-time/categorias/{categoriaId}/regras:
    parameters:
      - name: categoriaId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Regras de elenco da categoria (para o assistente de inscrição)
      description: |
        Exige só sessão de equipe (não há vínculo com a categoria antes de inscrever). Lê CategoriaCampeonato,
        RegraElenco, CategoriaConfiguracao (naipe) e a janela de inscrição da Liga. Não devolve token de convite.
        Sem RegraElenco valem os padrões (limites null, maximoLiberos 2). Categoria sem gênero = MISTO.
        `anoNascimentoMinimo`/`anoNascimentoMaximo` são o ano de nascimentoDe/nascimentoAte da regra.
      responses:
        '200':
          description: Regras
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/RegrasCategoria' }
        '404': { $ref: '#/components/responses/Erro' }
        '401': { $ref: '#/components/responses/Erro' }
        '503': { $ref: '#/components/responses/Erro' }
components:
  parameters:
    EquipeId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Erro:
      description: Falha
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Naipe:
      type: string
      enum: [FEMININO, MASCULINO, MISTO]
    StatusInscricao:
      type: string
      enum: [RASCUNHO, CONFIRMADA, CONFIRMADA_COM_PENDENCIAS, AJUSTE_PEDIDO, REMOVIDA]
    Erro:
      type: object
      required: [error]
      properties:
        error: { type: string }
        codigo: { type: string }
        erros:
          type: array
          items:
            type: object
            properties:
              codigo: { type: string }
              campo: { type: string }
              mensagem: { type: string }
              atletaId: { type: string }
    Prontidao:
      type: object
      required: [atletas, semDocumento, semAutorizacaoResponsavel, mensagem]
      properties:
        atletas: { type: integer }
        semDocumento: { type: integer }
        semAutorizacaoResponsavel: { type: integer, description: 'Menores sem autorização ativa do responsável legal' }
        mensagem: { type: string, example: 'Seu time tem 9 atletas. 2 estão sem documento. 1 está sem autorização do responsável.' }
    Equipe:
      type: object
      required: [id, nome, cidade, naipe, escudoUrl]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        cidade: { type: string, nullable: true }
        naipe: { $ref: '#/components/schemas/Naipe' }
        escudoUrl: { type: string, nullable: true }
    EquipeResumo:
      type: object
      required: [id, nome, cidade, naipe, totalAtletas, prontidao]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        cidade: { type: string, nullable: true }
        naipe: { $ref: '#/components/schemas/Naipe' }
        totalAtletas: { type: integer }
        prontidao: { $ref: '#/components/schemas/Prontidao' }
    Atleta:
      type: object
      required: [id, nome, dataNascimento, numeroPreferido, posicao, temDocumento, menor, consentimentoPendente]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        dataNascimento: { type: string, format: date, nullable: true }
        numeroPreferido: { type: integer, nullable: true }
        posicao: { type: string, nullable: true }
        temDocumento: { type: boolean }
        menor: { type: boolean, description: 'Menor de 18 anos, calculado no servidor. Sem data de nascimento: false.' }
        consentimentoPendente: { type: boolean, description: 'menor sem autorização ativa do responsável. Nunca há contato do responsável neste objeto.' }
    ResponsavelEntrada:
      type: object
      required: [nome, contato]
      properties:
        nome: { type: string, minLength: 1, maxLength: 200 }
        contato: { type: string, minLength: 5, maxLength: 200, description: 'Telefone ou e-mail. Gravado cifrado; nunca devolvido pela API.' }
    EstadoConsentimento:
      type: object
      required: [atletaId, estado, versaoTermo, aceitoEm, responsavelNome, termoDesatualizado]
      properties:
        atletaId: { type: string, format: uuid }
        estado: { type: string, enum: [PENDENTE, REGISTRADO] }
        versaoTermo: { type: string, nullable: true }
        aceitoEm: { type: string, format: date-time, nullable: true }
        responsavelNome: { type: string, nullable: true, description: 'Só RESPONSAVEL/TECNICO leem. O contato nunca é devolvido.' }
        termoDesatualizado: { type: boolean, description: 'O aceite foi dado em versão anterior do termo.' }
    FuncaoComissao:
      type: string
      enum: [TECNICO, ASSISTENTE, PREPARADOR_FISICO, FISIOTERAPEUTA, MEDICO]
    MembroComissao:
      type: object
      required: [id, nome, funcao]
      properties:
        id: { type: string, format: uuid, description: 'Usado em DELETE /comissao/{membroId} e em inscricoes.comissao' }
        nome: { type: string }
        funcao: { $ref: '#/components/schemas/FuncaoComissao' }
    RegrasCategoria:
      type: object
      required: [categoriaId, nome, naipe, minimoAtletas, maximoAtletas, maximoLiberos, maximoComissao, anoNascimentoMinimo, anoNascimentoMaximo, inscricoesAbertas]
      properties:
        categoriaId: { type: string, format: uuid }
        nome: { type: string }
        naipe: { $ref: '#/components/schemas/Naipe' }
        minimoAtletas: { type: integer, nullable: true }
        maximoAtletas: { type: integer, nullable: true }
        maximoLiberos: { type: integer }
        maximoComissao: { type: integer, nullable: true }
        anoNascimentoMinimo: { type: integer, nullable: true }
        anoNascimentoMaximo: { type: integer, nullable: true }
        inscricoesAbertas: { type: boolean }
    Membro:
      type: object
      required: [id, nome, papel]
      properties:
        id: { type: string, description: 'Identificador da conta (usado em DELETE /membros?membroId=)' }
        nome: { type: string }
        papel: { type: string, enum: [RESPONSAVEL, TECNICO, ASSISTENTE, CAPITAO] }
    InscricaoResumo:
      type: object
      required: [id, categoriaCampeonatoId, status, totalAtletas]
      properties:
        id: { type: string, format: uuid }
        categoriaCampeonatoId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/StatusInscricao' }
        totalAtletas: { type: integer }
