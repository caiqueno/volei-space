# Contrato da API de eventos da súmula. IMPLEMENTADO em src/app/api/sumula/[token]/eventos/route.ts,
# mas DESLIGADO por padrão: 404 sem SUMULA_EVENTOS_ATIVO=1; 503 se a migration 202610170023 (pendente,
# não aplicada) ainda não existir. Não substitui o PUT/POST atual de /api/sumula/{token}.
# Formato de resposta do projeto: { data } em sucesso, { error, details } em falha.
# Os códigos RG-* vêm de src/lib/regras-volei, do servidor (RG-LOG-007..011) e do 03-regras-validaveis.md.
openapi: 3.0.3
info:
  title: volei.space - eventos da súmula
  version: 0.2.0-implementado-desligado
paths:
  /api/sumula/{token}/eventos:
    parameters:
      - { name: token, in: path, required: true, schema: { type: string }, description: 'Mesmo token da súmula (link do jogo, árbitro escalado ou organizador da liga)' }
    get:
      summary: Estado derivado da partida e eventos do log
      parameters:
        - { name: apartirDeSeq, in: query, schema: { type: integer, minimum: 0 }, description: 'Filtra só a lista de eventos; o estado é sempre completo' }
      responses:
        '200':
          description: Estado derivado pelo motor (placar, saque, rotação, contadores, impedidos) e eventos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      estado: { $ref: '#/components/schemas/EstadoSumula' }
                      eventos: { type: array, items: { $ref: '#/components/schemas/SumulaEvento' } }
        '401': { $ref: '#/components/responses/Erro' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '503':
          description: Tabela SumulaEvento ou RPC ausente (migration pendente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    post:
      summary: Lote de eventos (validado pelo motor no servidor; idempotente; versão otimista)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [eventos]
              properties:
                seqEsperado: { type: integer, minimum: 0, description: 'Último seq que o cliente conhece. Omitido = sem controle de versão' }
                eventos:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [clientEventId, tipo]
                    properties:
                      clientEventId: { type: string, format: uuid }
                      tipo: { $ref: '#/components/schemas/Tipo' }
                      payload: { type: object }
                      desfazId: { type: integer, nullable: true, description: 'seq do evento desfeito; obrigatório e exclusivo de DESFAZ' }
                      ocorridoEm: { type: string, format: date-time, description: 'Quando aconteceu no cliente (reenvio offline)' }
      responses:
        '200':
          description: Lote processado. Cada evento volta aceito (novo ou duplicado) ou rejeitado; o primeiro rejeitado interrompe o lote
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      aceitos: { type: array, items: { $ref: '#/components/schemas/EventoAceito' } }
                      rejeitados: { type: array, items: { $ref: '#/components/schemas/EventoRejeitado' } }
                      estado: { $ref: '#/components/schemas/EstadoSumula' }
        '401': { $ref: '#/components/responses/Erro' }
        '403': { $ref: '#/components/responses/Erro' }
        '404': { $ref: '#/components/responses/Erro' }
        '409':
          description: seqEsperado desatualizado (outro apontador gravou antes). Nada foi gravado depois do conflito; details traz o estado atual
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  details:
                    type: object
                    properties:
                      codigo: { type: string, example: RG-LOG-010 }
                      seqAtual: { type: integer }
                      aceitos: { type: array, items: { $ref: '#/components/schemas/EventoAceito' } }
                      estado: { $ref: '#/components/schemas/EstadoSumula' }
        '422':
          description: Envelope inválido. Regra de jogo violada NÃO vira 422; vem em rejeitados com status 200
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '503':
          description: Tabela SumulaEvento ou RPC ausente (migration pendente)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  # ---- Rodada 19: rotas das rodadas 15 a 18 (OpenAPI mínimo, só resumo, flag e acesso; sem schema de corpo). ----
  # Todas atrás de flag (desligada = 404). Contrato do Meu Time: 20-contrato-meu-time.yaml. Todas as rotas: 32-inventario-api.md.
