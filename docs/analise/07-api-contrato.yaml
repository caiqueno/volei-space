components:
  responses:
    Erro:
      description: Falha genérica (404 também quando a rota está desligada)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Tipo:
      type: string
      enum:
        - SET_INICIADO
        - PONTO
        - RALLY_REPETIDO
        - SUBSTITUICAO
        - TEMPO
        - TROCA_LIBERO
        - REDESIGNACAO_LIBERO
        - SANCAO
        - FALTA_POSICAO
        - FALTA_ROTACAO
        - TROCA_LADO
        - SET_ANULADO
        - INTERRUPCAO
        - WO
        - EQUIPE_INCOMPLETA
        - OBSERVACAO
        - DESFAZ
    SumulaEvento:
      type: object
      required: [seq, tipo, payload, clientEventId, desfazId]
      properties:
        seq: { type: integer, minimum: 1 }
        tipo: { $ref: '#/components/schemas/Tipo' }
        payload: { type: object }
        clientEventId: { type: string }
        desfazId: { type: integer, nullable: true }
        criadoEm: { type: string, format: date-time }
    Aviso:
      type: object
      properties:
        codigo: { type: string, example: RG-SUB-001 }
        mensagem: { type: string }
    Erro:
      type: object
      properties:
        error: { type: string }
        details: {}
    EventoAceito:
      type: object
      properties:
        indice: { type: integer }
        clientEventId: { type: string }
        seq: { type: integer }
        duplicado: { type: boolean }
        avisos: { type: array, items: { $ref: '#/components/schemas/Aviso' } }
    EventoRejeitado:
      type: object
      properties:
        indice: { type: integer }
        clientEventId: { type: string }
        codigo: { type: string, example: RG-SUB-001 }
        mensagem: { type: string, description: 'Em português, para o apontador' }
        naoProcessado: { type: boolean, description: 'true = RG-LOG-009, nem chegou a ser avaliado' }
    EstadoSumula:
      type: object
      properties:
        status: { type: string, enum: [NAO_INICIADA, EM_ANDAMENTO, ENCERRADA, WO, A_REPETIR] }
        ultimoSeq: { type: integer }
        setsGanhos: { type: object, properties: { a: { type: integer }, b: { type: integer } } }
        vencedor: { type: string, enum: [A, B], nullable: true }
        saca: { type: string, enum: [A, B], nullable: true }
        placar: { type: object, nullable: true, properties: { a: { type: integer }, b: { type: integer } } }
        setAtual: { type: object, nullable: true }
        rotacao: { type: object, description: 'A e B: 6 jogadores, índice 0 = posição I (saque)' }
        contadores: { type: object, description: 'Por equipe no set: tempos, substituições regulares e excepcionais, trocas de líbero, redesignações' }
        impedidos: { type: object, description: 'A e B: jogadores que não podem atuar agora' }
        limites: { type: object, properties: { substituicoesPorSet: { type: integer }, temposPorSet: { type: integer } } }
        sets: { type: array, items: { type: object } }
        observacoes: { type: array, items: { type: object } }
        houveCancelamentoDePontos: { type: boolean }
        inconsistencias: { type: array, items: { type: object } }
