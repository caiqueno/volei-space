name: Seguranca

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: seguranca-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão fixada do gitleaks. Para atualizar: troque aqui, num PR próprio.
  GITLEAKS_VERSION: "8.21.2"

jobs:
  gitleaks:
    name: Segredos no histórico (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout com histórico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar o gitleaks oficial e conferir o checksum
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${arquivo}" "${base}/${arquivo}"
          curl -sSfL -o "${RUNNER_TEMP}/checksums.txt" "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep " ${arquivo}\$" checksums.txt | sha256sum -c -)
          tar -xzf "${RUNNER_TEMP}/${arquivo}" -C "${RUNNER_TEMP}" gitleaks

      - name: Rodar o gitleaks sobre todo o histórico
        # --redact: o valor do segredo nunca aparece no log.
        # Achado já tratado entra por fingerprint em .gitleaksignore (veja .gitleaks.toml).
        run: |
          "${RUNNER_TEMP}/gitleaks" detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose

  npm-audit:
    name: Dependências (npm audit, só relatório)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Relatório, não bloqueio: não falha o PR. Quando as vulnerabilidades altas
      # conhecidas estiverem tratadas, remova o continue-on-error.
      - name: npm audit (produção, severidade alta ou maior)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
