name: Testes

on:
  pull_request:
  push:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: volei
          POSTGRES_PASSWORD: volei_ci_local
          POSTGRES_DB: volei_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U volei -d volei_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://volei:volei_ci_local@localhost:5432/volei_test
      DIRECT_URL: postgresql://volei:volei_ci_local@localhost:5432/volei_test
      JWT_SECRET: teste-local-jwt-secret-32-chars-min
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3001
      INFINITEPAY_WEBHOOK_SECRET: teste-local-infinitepay-webhook
      INFINITEPAY_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Typecheck
        run: npm run typecheck
      - name: Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testes
        run: npm test
